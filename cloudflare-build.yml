
name: TickLens Cloudflare Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build TickLens
        run: pnpm run build

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ticklens-build
          path: |
            .output/
            dist/
            .vercel/output/
          if-no-files-found: warn
